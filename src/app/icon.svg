<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 36 36" width="36" height="36">
  <title>Alpha Brackets</title>
  <!--
    Favicon. The two paths are the hexagon mark lifted verbatim from
    public/brand/logo.svg, which is a wide wordmark (244x30) and unreadable
    at 16px. The mark alone occupies exactly 0 0 30 30 there, so it crops to a
    square with no distortion. The viewBox is inset by 3 on each side for a little
    breathing room in the browser tab.

    This file uses the Next.js app-directory icon convention, so Next serves it and
    injects the <link rel="icon"> itself. There is no manual `icons` entry in
    layout.tsx, and no favicon.ico, on purpose.
  -->
